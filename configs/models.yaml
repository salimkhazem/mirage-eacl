# The "examinees".
#
# Selection is driven by one measured fact: se(delta_hat) ~ (sum_m p(1-p))^(-1/2),
# so drift precision is bounded by the number of *models*, not items. The grid is
# therefore as wide as the hardware allows, and deliberately spans a large ability
# range -- base/instruct pairs of the same checkpoint are included precisely because
# they differ in ability while holding architecture and tokenizer fixed.
#
# Tier 1  smoke test, one small cached model.
# Tier 2  the core grid: every model whose weights are already in the local HF
#         cache, so the run starts with zero download.
# Tier 3  small extra downloads that widen the low end and add the European arm.
#
# All tier-2 entries fit bf16 on a 32 GB RTX 5000 Ada; the largest (gemma-2-9b,
# ~18.5 GB) also fits, so no quantisation is used anywhere. Quantisation would
# perturb ability in a language-dependent way and contaminate the very estimand
# this paper is about.

defaults:
  dtype: bfloat16
  trust_remote_code: false
  batch_size: 32
  # 4096, not 2048. At 2048 the engine rejected prompts over the limit, and the
  # rejections were concentrated in Tamil, Bengali, Hindi and Greek -- exactly the
  # high-fertility, non-Latin-script languages that also show the largest gaps.
  # Dropping those shards would have selected the sample on the outcome. The
  # episode is itself an instance of the paper's theme: a fixed token budget is
  # not a language-neutral experimental control.
  max_model_len: 8192

models:

  # --- tier 1 -----------------------------------------------------------------
  - name: llama-3.2-1b
    hf_id: meta-llama/Llama-3.2-1B-Instruct
    revision: main
    tier: 1
    params_b: 1.24
    cached: true

